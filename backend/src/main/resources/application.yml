server:
  port: 8080

spring:
  application:
    name: photography-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/photography?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 业务上限为单文件 10MB（服务层二次校验并计入 failed 清单）；
      # 容器上限略高，保证 10~20MB 的文件能进入业务校验并返回明确原因。
      max-file-size: 20MB
      max-request-size: 420MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    # JWT 密钥与数据库密码放在 application-local.yml（不进 Git），见 application-example.yml
    secret: ${JWT_SECRET:}
    expire-hours: 24
  upload-dir: uploads/
