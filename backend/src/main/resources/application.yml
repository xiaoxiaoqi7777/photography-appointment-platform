server:
  port: 8080

spring:
  application:
    name: photography-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/photography?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    # JWT 密钥与数据库密码放在 application-local.yml（不进 Git），见 application-example.yml
    secret: ${JWT_SECRET:}
    expire-hours: 24
  upload-dir: uploads/
